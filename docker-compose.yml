# Local Postgres for development and the server test suite.
#   docker compose up -d
#   npm run db:migrate && npm run db:seed
services:
  postgres:
    image: postgres:16
    container_name: gerabyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gerabyte_app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: gerabyte_dev
    ports:
      - '5432:5432'
    volumes:
      - gerabyte-pgdata:/var/lib/postgresql/data
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gerabyte_app -d gerabyte_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gerabyte-pgdata:
